<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotePalette</title>
  <link rel="stylesheet" href="detached.css">
</head>
<body>
  <main id="note" class="c0">
    <header>
      <div id="note-title" title="ダブルクリックでノート名を変更"></div>
      <div class="actions">
        <button id="font-down" title="文字を小さくする">A−</button>
        <span id="font-size"></span>
        <button id="font-up" title="文字を大きくする">A+</button>
        <button id="copy" title="現在のページをコピー">⧉</button>
        <button id="always-on-top" title="常に手前に表示">📌</button>
        <button id="return-board" title="メインボードへ戻す">↙</button>
      </div>
    </header>
    <div id="page-bar">
      <div id="pages"></div>
      <button id="add-page" title="ページを追加">＋</button>
    </div>
    <div id="editors"></div>
    <footer><span id="status">読み込み中…</span><span>NotePalette</span></footer>
  </main>
  <script type="module" src="../dist/renderer/detached.js"></script>
</body>
</html>
